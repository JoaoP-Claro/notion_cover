<style>
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: #191919; 
    color: #d4d4d4; 
    padding: 12px; 
    margin: 0; 
    overflow-x: auto; /* Enables horizontal scroll */
  }
  
  .calendar-container {
    /* Set a fixed minimum width so 52 blocks never shrink */
    min-width: 800px; 
  }

  .header-row {
    display: flex;
    align-items: center;
    margin-bottom: 2px;
  }
  .month-grid {
    display: grid;
    grid-template-columns: repeat(52, 1fr);
    gap: 3px;
    flex-grow: 1;
  }
  .month-label {
    font-size: 10px;
    color: #787774;
    text-align: left;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
  }

  /* Quarter Accent Line Row */
  .quarter-row {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
  }
  .quarter-grid {
    display: grid;
    grid-template-columns: repeat(52, 1fr);
    gap: 3px;
    flex-grow: 1;
  }
  .quarter-line {
    height: 3px;
    border-radius: 2px;
  }
  .q1-line { background: #e74c3c; } 
  .q2-line { background: #f39c12; } 
  .q3-line { background: #2ecc71; } 
  .q4-line { background: #9b59b6; } 

  .year-row { 
    display: flex; 
    align-items: center; 
    margin-bottom: 10px; 
  }
  .year-label { 
    font-weight: 600; 
    width: 45px; 
    font-size: 13px; 
    color: #a4a4a4; 
    flex-shrink: 0;
  }
  .grid { 
    display: grid; 
    grid-template-columns: repeat(52, 1fr); 
    gap: 3px; 
    flex-grow: 1; 
  }
  .block { 
    width: 100%; 
    aspect-ratio: 1; 
    border-radius: 2px; 
    background: #2f2f2f; 
    transition: transform 0.1s ease; 
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7px;
    color: rgba(255, 255, 255, 0.4);
    user-select: none;
  }

  .block.past { 
    background: #2eaadc; 
    color: #fff; 
  }

  .block.current { 
    background: #2196f3 !important; 
    color: #fff !important;
    font-weight: bold;
    transform: scale(1.3); 
    box-shadow: 0 0 8px #2196f3; 
    z-index: 2;
  } 

  /* Keep full sizes on mobile and allow sideways scroll */
  @media (max-width: 768px) {
    body {
      padding: 8px;
    }
  }
</style>
